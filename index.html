
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栄冠ナイン 対戦用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>栄冠ナイン 対戦用</h1>
        <p>あじゅうさんが偉いので作りました</p>
    </header>

    <nav class="tabs">
        <button id="resultTab" class="tab active">大会結果</button>
        <button id="inputTab" class="tab">試合入力</button>
    </nav>

    <main>
        <section id="resultScreen" class="screen active">
            <h2>総当たり戦順位表</h2>
            <div id="standings">参加者を登録してください。</div>

            <h2>決勝</h2>
            <div id="championship">まだ対戦相手が決まっていません。</div>

            <h2>最下位決定戦</h2>
            <div id="lastPlace">まだ対戦相手が決まっていません。</div>

            <h2>最終順位</h2>
            <div id="finalStandings">順位決定戦終了後に表示されます。</div>
        </section>

        <section id="inputScreen" class="screen">
            <h2>参加者設定</h2>
            <div id="teamSettings"></div>

            <h2>試合入力</h2>
            <div class="match-form">
                <label for="matchType">試合の種類</label>
                <select id="matchType">
                    <option value="league">総当たり戦</option>
                    <option value="final">決勝</option>
                    <option value="last">最下位決定戦</option>
                </select>

                <label for="teamA">対戦者①</label>
                <select id="teamA"></select>

                <label for="teamB">対戦者②</label>
                <select id="teamB"></select>

                <div class="score-area">
                    <div>
                        <label for="scoreA" id="scoreALabel">参加者①の得点</label>
                        <input id="scoreA" type="number" min="0" step="1" placeholder="0">
                    </div>
                    <span>－</span>
                    <div>
                        <label for="scoreB" id="scoreBLabel">参加者②の得点</label>
                        <input id="scoreB" type="number" min="0" step="1" placeholder="0">
                    </div>
                </div>

                <label for="cold">コールド情報</label>
                <select id="cold">
                    <option value="">コールドなし</option>
                    <option value="1">1回コールド</option>
                    <option value="2">2回コールド</option>
                    <option value="3">3回コールド</option>
                    <option value="4">4回コールド</option>
                    <option value="5">5回コールド</option>
                    <option value="6">6回コールド</option>
                    <option value="7">7回コールド</option>
                    <option value="8">8回コールド</option>
                    <option value="9">9回コールド</option>
                </select>

                <label>ホームランを打った選手</label>
                <p class="input-note">選手名とホームラン本数を入力してください。同じ選手が複数本打った場合は、本数をまとめて入力できます。</p>
                <div id="homeRunInputs" class="home-run-inputs"></div>
                <button type="button" id="addHomeRun" class="add-home-run-button">＋ 選手を追加</button>

                <button id="saveMatch" class="save-button">試合結果を登録</button>
            </div>

            <h2>登録済みの試合</h2>
            <div id="matchHistory"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
